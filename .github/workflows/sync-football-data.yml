name: Sync Football Data (LEGACY TheSportsDB - do not run with API-Football sync)

on:
  workflow_dispatch: {}       # تشغيل يدوي من تبويب Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies for the sync script
        run: npm install --no-save --legacy-peer-deps tsx firebase-admin

      - name: Run clubs sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
        run: npx tsx scripts/syncFootballData.ts
