name: Sync Squads (API-Football)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '40 0 * * *'   # يوميًا 00:40 UTC بعد تصفير الحصة؛ لا يستهلك شيئًا إن اكتملت كل التشكيلات

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --legacy-peer-deps tsx firebase-admin
      - name: Sync squads
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MAX_REQUESTS: '85'
        run: npx tsx scripts/syncSquadsApiFootball.ts
